# Quiet log4j config for local Spark: only errors from the JVM side, so the
# pipeline's own log lines stay readable. Delete this file's reference in
# utils/spark.py (or set rootLogger.level = info) when debugging Spark itself.
rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} | %-7p | spark | %c{1}: %m%n
