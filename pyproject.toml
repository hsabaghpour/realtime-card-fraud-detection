[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelpay"
version = "0.1.0"
description = "Portfolio MVP of a real-time card fraud detection platform (PySpark, Delta Lake, MLflow, Airflow, Streamlit)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
# Version ranges live here; exact, fully-resolved pins live in requirements.lock.
dependencies = [
    "pyspark>=4.0,<4.1",
    "delta-spark>=4.0,<4.1",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pre-commit>=3"]

[project.scripts]
sentinelpay = "sentinelpay.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
# `from pyspark.sql import functions as F` is the universal PySpark convention.
ignore = ["N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["spark: tests that start a local Spark session (slower)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["sentinelpay"]
